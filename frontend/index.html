<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FlowPad · 智能杯垫</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <!-- 侧边栏 -->
    <aside id="sidebar">
        <div class="sidebar-brand">
            <span class="brand-text"><span class="brand-hl">Flow</span>Pad</span>
        </div>

        <nav class="sidebar-nav">
            <a href="#/" class="sidebar-item active" data-page="/">
                <span class="nav-text">仪表盘</span>
            </a>
            <a href="#/calibrate" class="sidebar-item" data-page="/calibrate">
                <span class="nav-text">校准</span>
            </a>
            <a href="#/settings" class="sidebar-item" data-page="/settings">
                <span class="nav-text">设置</span>
            </a>
            <a href="#/wifi" class="sidebar-item" data-page="/wifi">
                <span class="nav-text">配网</span>
            </a>
        </nav>

        <button class="sidebar-toggle" id="sidebarToggle" title="收起侧边栏">
            <span class="toggle-icon"></span>
        </button>
    </aside>

    <!-- 主内容区 -->
    <main id="app"></main>

    <script src="js/router.js"></script>
    <script src="js/api.js"></script>
    <script src="js/pages/dashboard.js"></script>
    <script src="js/pages/calibrate.js"></script>
    <script src="js/pages/settings.js"></script>
    <script src="js/pages/wifi.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
